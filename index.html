<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThumbAI — YouTube Thumbnail Research & Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --coral:#D85A30;--coral-d:#993C1D;--coral-l:rgba(216,90,48,0.12);
  --bg:#0f0f0f;--bg2:#181818;--bg3:#272727;--bg4:#303030;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f1f1f1;--text2:#aaa;--text3:#606060;
  --r:10px;--rs:6px;
}
html{font-size:14px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
nav{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 20px;gap:16px}
.logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.5px;flex-shrink:0;text-decoration:none;color:var(--text)}
.logo span{color:var(--coral)}
.nsw{flex:1;max-width:580px;display:flex;border:1px solid var(--border2);border-radius:40px;overflow:hidden;background:var(--bg2);transition:border-color .2s}
.nsw:focus-within{border-color:var(--coral)}
.nsw input{flex:1;background:transparent;border:none;outline:none;padding:0 16px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);height:38px}
.nsw input::placeholder{color:var(--text3)}
.nsw button{background:var(--bg3);border:none;border-left:1px solid var(--border);width:50px;height:38px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .15s}
.nsw button:hover{background:var(--coral);color:#fff}
.badge{font-size:11px;background:var(--coral-l);color:var(--coral);padding:3px 10px;border-radius:100px;border:1px solid var(--coral);margin-left:auto}
.filters{background:var(--bg);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.flbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;margin-right:2px}
.chip{flex-shrink:0;padding:5px 13px;border-radius:100px;font-size:12px;font-weight:500;border:1px solid var(--border2);color:var(--text2);cursor:pointer;background:var(--bg2);transition:all .15s;white-space:nowrap;user-select:none}
.chip:hover{border-color:var(--text2);color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.con{background:var(--coral);color:#fff;border-color:var(--coral)}
.fsep{width:1px;height:20px;background:var(--border2);flex-shrink:0;margin:0 4px}
.layout{display:grid;grid-template-columns:1fr 390px;min-height:calc(100vh - 102px)}
.main{padding:20px;border-right:1px solid var(--border);overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.st{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.07em}
.sc{font-size:12px;color:var(--text3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px 12px}
.card{cursor:pointer;border-radius:var(--r);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card.sel .iw{outline:2.5px solid var(--coral);border-radius:var(--r)}
.iw{position:relative;aspect-ratio:16/9;background:var(--bg3);border-radius:var(--r);overflow:hidden}
.iw img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.85);color:#fff;font-size:11px;font-weight:600;padding:2px 5px;border-radius:3px}
.qbadge{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px}
.qs{background:#1a4d1a;color:#7ecf7e}.qa{background:#2d4a00;color:#a8d45e}.qc{background:#4a3000;color:#d4a83e}
.ci{display:flex;gap:10px;padding:10px 2px 0}
.av{width:34px;height:34px;border-radius:50%;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mt{flex:1;min-width:0}
.vt{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.vc{font-size:12px;color:var(--text2);margin-bottom:2px}
.vs{font-size:11px;color:var(--text3)}
.sidebar{background:var(--bg)}
.si{position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px}
.pt{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.pt i{color:var(--coral);font-size:15px}
.wi{display:flex;gap:10px;align-items:flex-start;padding:9px;background:var(--bg3);border-radius:var(--rs);border:1px solid var(--border);margin-bottom:8px}
.we{font-size:17px;flex-shrink:0;margin-top:1px}
.wl{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px}
.wd{font-size:11px;color:var(--text2);line-height:1.5}
.sbr{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.sbl{font-size:11px;color:var(--text3);margin-bottom:5px}
.sbw{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden}
.sbf{height:100%;border-radius:4px;background:var(--coral);transition:width .6s ease}
.sbv{font-size:13px;font-weight:700;color:var(--coral);margin-top:4px}
.ytl{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--rs);border:1px solid var(--border);text-decoration:none;color:var(--text2);font-size:12px;transition:all .15s}
.ytl:hover{border-color:#ff0000;color:#ff0000}
.ph{text-align:center;padding:28px 12px;color:var(--text3);font-size:13px;line-height:1.6}
.ph i{font-size:30px;display:block;margin-bottom:8px;opacity:.3}
.uz{border:1.5px dashed var(--border2);border-radius:var(--rs);padding:14px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:10px;position:relative}
.uz:hover,.uz.drag{border-color:var(--coral);background:var(--coral-l)}
.uz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.uz i{font-size:22px;color:var(--text3);display:block;margin-bottom:4px}
.uz p{font-size:12px;color:var(--text3)}
.uz p span{color:var(--coral)}
.prevs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pi{width:54px;height:40px;object-fit:cover;border-radius:5px;border:1px solid var(--border2)}
.pw{position:relative;display:inline-block}
.pr{position:absolute;top:-5px;right:-5px;width:16px;height:16px;background:var(--coral);color:#fff;border-radius:50%;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.fl{font-size:11px;color:var(--text3);margin-bottom:4px;display:block;margin-top:8px}
.gi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:8px 11px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .15s;resize:none}
.gi:focus{border-color:var(--coral)}
.gi::placeholder{color:var(--text3)}
textarea.gi{min-height:80px;line-height:1.5}
.gb{width:100%;background:var(--coral);color:#fff;border:none;border-radius:var(--rs);padding:11px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s;margin-top:10px}
.gb:hover{background:var(--coral-d)}
.gb:disabled{opacity:.5;cursor:not-allowed}
.regen{width:100%;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--rs);padding:9px;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;display:none;align-items:center;justify-content:center;gap:6px;transition:all .15s;margin-top:8px}
.regen:hover{border-color:var(--coral);color:var(--coral)}
.prog{height:3px;background:var(--bg3);border-radius:2px;margin-top:10px;overflow:hidden;display:none}
.prog.on{display:block}
.pf{height:100%;width:0%;background:var(--coral);border-radius:2px;animation:pfa 5s ease forwards}
@keyframes pfa{to{width:95%}}
.ra{margin-top:12px;display:none}
.ra.on{display:block}
.ri{width:100%;aspect-ratio:16/9;border-radius:var(--rs);object-fit:cover;border:1px solid var(--border)}
.rph{width:100%;aspect-ratio:16/9;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text3);text-align:center;padding:12px}
.dl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;text-decoration:none;width:100%}
.dl:hover{border-color:var(--coral);color:var(--coral)}
.skel{background:var(--bg3);border-radius:var(--r);position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sh 1.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sk-t{aspect-ratio:16/9;border-radius:var(--r)}
.sk-l{height:11px;border-radius:4px;margin-top:7px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:40px;display:block;margin-bottom:10px;opacity:.3}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="#">Thumb<span>AI</span></a>
  <div class="nsw">
    <input type="text" id="navQ" placeholder="Search any YouTube topic..." onkeydown="if(event.key==='Enter')doSearch()"/>
    <button onclick="doSearch()"><i class="ti ti-search"></i></button>
  </div>
  <span class="badge">Beta</span>
</nav>

<div class="filters">
  <span class="flbl">Sort</span>
  <div class="chip on" data-sort="viewCount" onclick="setSort(this)">Most Viewed</div>
  <div class="chip" data-sort="date" onclick="setSort(this)">Most Recent</div>
  <div class="chip" data-sort="relevance" onclick="setSort(this)">Best Match</div>
  <div class="fsep"></div>
  <span class="flbl">Period</span>
  <div class="chip" data-date="" onclick="setDate(this)">All time</div>
  <div class="chip con" data-date="month" onclick="setDate(this)">This month</div>
  <div class="chip" data-date="week" onclick="setDate(this)">This week</div>
  <div class="fsep"></div>
  <span class="flbl">Length</span>
  <div class="chip" data-len="" onclick="setLen(this)">Any</div>
  <div class="chip con" data-len="medium" onclick="setLen(this)">4–20 min</div>
  <div class="chip" data-len="long" onclick="setLen(this)">20+ min</div>
</div>

<div class="layout">
  <div class="main">
    <div class="sh">
      <span class="st" id="secTitle">Trending now</span>
      <span class="sc" id="secCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <aside class="sidebar">
    <div class="si">
      <div class="panel">
        <div class="pt"><i class="ti ti-bulb"></i> Thumbnail analysis</div>
        <div class="ph" id="analysisPh"><i class="ti ti-hand-click"></i>Click any thumbnail<br>to see why it works</div>
        <div id="analysisBody" style="display:none"></div>
      </div>

      <div class="panel">
        <div class="pt"><i class="ti ti-wand"></i> Generate your thumbnail</div>
        <div class="uz" id="uz">
          <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)"/>
          <i class="ti ti-photo-up"></i>
          <p>Drop your photos here or <span>browse</span></p>
          <p style="font-size:10px;margin-top:2px;opacity:.6">Upload one or multiple photos</p>
        </div>
        <div class="prevs" id="prevs"></div>
        <label class="fl">Your video title & what it's about</label>
        <textarea class="gi" id="genPrompt" placeholder="e.g. I earned ৳50,000 from blogging in 3 months — full income proof and honest journey..."></textarea>
        <label class="fl">Text to show ON the thumbnail</label>
        <input class="gi" type="text" id="genText" placeholder="e.g. ৳50,000 in 3 months!"/>
        <label class="fl">Style, colors, mood — write naturally</label>
        <input class="gi" type="text" id="genStyle" placeholder="e.g. bold red background, white text, shocked face, dramatic lighting"/>
        <div class="prog" id="prog"><div class="pf"></div></div>
        <button class="gb" id="genBtn" onclick="generate()">
          <i class="ti ti-sparkles"></i> Generate with Gemini AI
        </button>
        <button class="regen" id="regenBtn" onclick="regenerate()">
          <i class="ti ti-refresh"></i> Generate another version
        </button>
        <div class="ra" id="ra">
          <img class="ri" id="ri" alt="Generated thumbnail" style="display:none"/>
          <div class="rph" id="rph" style="display:none"></div>
          <a class="dl" id="dlBtn" href="#" download="thumbnail.jpg" style="display:none">
            <i class="ti ti-download"></i> Download thumbnail
          </a>
        </div>
      </div>
    </div>
  </aside>
</div>

<script>
const YT_KEY='AIzaSyD8BR5CwXnlWpXIKYDzNvPshYfpbNA-_f4';
const GM_KEY='AIzaSyB2meVb5aEAwChvDSqMySnpui6OauooZeA';

let sortOrder='viewCount',dateFilter='month',durFilter='medium';
let currentQ='most popular videos',selectedVid=null;
let uploadedImgs=[],lastPrompt='';
let chCache={};

const AV_COLORS=['#c0392b','#8e44ad','#2980b9','#27ae60','#d35400','#16a085','#2c3e50','#e91e63'];
function avColor(n){let h=0;for(let c of n)h=c.charCodeAt(0)+((h<<5)-h);return AV_COLORS[Math.abs(h)%AV_COLORS.length];}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}

function setSort(el){
  el.parentElement.querySelectorAll('[data-sort]').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');sortOrder=el.dataset.sort;reload();
}
function setDate(el){
  el.parentElement.querySelectorAll('[data-date]').forEach(c=>c.classList.remove('con'));
  el.classList.add('con');dateFilter=el.dataset.date;reload();
}
function setLen(el){
  el.parentElement.querySelectorAll('[data-len]').forEach(c=>c.classList.remove('con'));
  el.classList.add('con');durFilter=el.dataset.len;reload();
}
function reload(){doSearch(currentQ,true);}

function publishedAfter(){
  if(!dateFilter)return'';
  const d=new Date();
  if(dateFilter==='week')d.setDate(d.getDate()-7);
  else if(dateFilter==='month')d.setMonth(d.getMonth()-1);
  else if(dateFilter==='year')d.setFullYear(d.getFullYear()-1);
  return'&publishedAfter='+d.toISOString();
}

function thumbScore(v){
  let s=50;
  const views=parseInt(v.statistics?.viewCount||0);
  const likes=parseInt(v.statistics?.likeCount||0);
  if(views>5000000)s+=20;else if(views>1000000)s+=15;
  else if(views>500000)s+=11;else if(views>100000)s+=7;else if(views>10000)s+=3;
  if(views>0){const r=likes/views;if(r>.05)s+=8;else if(r>.03)s+=5;else if(r>.01)s+=2;}
  if(v.durationSecs>1200)s+=8;else if(v.durationSecs>600)s+=5;else if(v.durationSecs>300)s+=2;
  if(v.thumbnail?.includes('maxres'))s+=12;
  else if(v.thumbnail?.includes('hq'))s+=6;
  if(!v.thumbnail)s-=20;
  return Math.min(99,Math.max(50,s));
}
function scoreClass(s){return s>=88?'qs':s>=72?'qa':'qc';}

function isoSecs(iso){
  if(!iso)return 0;
  const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m)return 0;
  return(parseInt(m[1]||0)*3600)+(parseInt(m[2]||0)*60)+parseInt(m[3]||0);
}
function fmtDur(iso){
  const s=isoSecs(iso);if(!s)return'';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h)return`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return`${m}:${String(sec).padStart(2,'0')}`;
}
function fmtViews(n){
  n=parseInt(n||0);
  if(n>=1000000)return(n/1000000).toFixed(1)+'M views';
  if(n>=1000)return(n/1000).toFixed(0)+'K views';
  return n+' views';
}
function ago(dateStr){
  const d=new Date(dateStr),now=new Date(),days=Math.floor((now-d)/86400000);
  if(days<1)return'today';if(days<30)return days+'d ago';
  if(days<365)return Math.floor(days/30)+'mo ago';
  return Math.floor(days/365)+'y ago';
}

async function apiFetch(url){
  try{const r=await fetch(url);if(r.ok)return r.json();}catch(e){}
  const r2=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
  const d=await r2.json();return JSON.parse(d.contents);
}

async function fetchChannelLogos(ids){
  const missing=[...new Set(ids)].filter(id=>!chCache[id]);
  if(!missing.length)return;
  try{
    const data=await apiFetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${missing.slice(0,50).join(',')}&key=${YT_KEY}`);
    (data.items||[]).forEach(ch=>{chCache[ch.id]=ch.snippet?.thumbnails?.default?.url||'';});
  }catch(e){}
}

async function fetchVideos(q){
  const dur=durFilter?`&videoDuration=${durFilter}`:'';
  const pub=publishedAfter();
  const s=await apiFetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=24&order=${sortOrder}${dur}${pub}&key=${YT_KEY}`);
  if(!s.items?.length)return[];
  const ids=s.items.map(i=>i.id.videoId).join(',');
  const det=await apiFetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails,snippet&id=${ids}&key=${YT_KEY}`);
  const videos=s.items.map(item=>{
    const d=(det.items||[]).find(x=>x.id===item.id.videoId)||{};
    const secs=isoSecs(d.contentDetails?.duration||'');
    const thumb=item.snippet.thumbnails?.maxres?.url||item.snippet.thumbnails?.high?.url||item.snippet.thumbnails?.medium?.url||'';
    return{id:item.id.videoId,title:item.snippet.title,channel:item.snippet.channelTitle,
      channelId:item.snippet.channelId,publishedAt:item.snippet.publishedAt,
      thumbnail:thumb,statistics:d.statistics||{},durationRaw:d.contentDetails?.duration||'',
      durationSecs:secs};
  }).filter(v=>v.durationSecs>60);
  await fetchChannelLogos(videos.map(v=>v.channelId));
  return videos.map(v=>({...v,score:thumbScore(v),duration:fmtDur(v.durationRaw)}));
}

function renderSkel(){
  document.getElementById('grid').innerHTML=Array(8).fill(0).map(()=>`
    <div>
      <div class="skel sk-t"></div>
      <div style="display:flex;gap:10px;padding:10px 2px 0">
        <div class="skel" style="width:34px;height:34px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skel sk-l" style="width:90%;margin-top:0"></div>
          <div class="skel sk-l" style="width:60%"></div>
          <div class="skel sk-l" style="width:40%"></div>
        </div>
      </div>
    </div>`).join('');
}

function renderVideos(vids){
  window._vids=vids;
  if(!vids.length){
    document.getElementById('grid').innerHTML=`<div class="empty"><i class="ti ti-mood-sad"></i><p>No results found.<br>Try different filters or search.</p></div>`;
    return;
  }
  document.getElementById('grid').innerHTML=vids.map((v,i)=>{
    const chThumb=chCache[v.channelId]||'';
    const avHtml=chThumb?`<img src="${chThumb}" alt="${v.channel}" onerror="this.style.display='none'"/>`:'';
    const avStyle=chThumb?'':`background:${avColor(v.channel)}`;
    const avText=chThumb?'':initials(v.channel);
    const sc=scoreClass(v.score);
    return`<div class="card${selectedVid===i?' sel':''}" onclick="pick(${i})">
      <div class="iw">
        <img src="${v.thumbnail}" alt="" loading="lazy" onerror="this.style.opacity='.15'"/>
        ${v.duration?`<div class="dur">${v.duration}</div>`:''}
        <div class="qbadge ${sc}">${v.score}</div>
      </div>
      <div class="ci">
        <div class="av" style="${avStyle}">${avHtml}${avText}</div>
        <div class="mt">
          <div class="vt">${v.title}</div>
          <div class="vc">${v.channel}</div>
          <div class="vs">${fmtViews(v.statistics.viewCount)} · ${ago(v.publishedAt)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

const WHY=[
  {e:'🎨',l:'High contrast colors',d:'Bold contrast keeps the thumbnail visible even at tiny sizes in a crowded feed.'},
  {e:'😮',l:'Emotional face',d:'Human faces with strong emotions trigger instinctive clicks — we are wired to look at faces.'},
  {e:'💰',l:'Specific number hook',d:'Exact numbers feel credible and real — triggers immediate curiosity in viewers.'},
  {e:'📅',l:'Time boundary',d:'A specific timeframe makes results feel achievable and not exaggerated.'},
  {e:'🔢',l:'List format',d:'Number-based thumbnails signal structured content — viewers know what they are getting.'},
  {e:'🔴',l:'Urgency color',d:'Red and orange tones stop the scroll better than cooler colors in a busy feed.'},
  {e:'🎯',l:'Direct audience targeting',d:'Mentioning a specific niche makes the right viewers feel it is made for them.'},
  {e:'⚡',l:'Comparison hook',d:'Versus-style thumbnails make viewers pick a side — instant emotional engagement.'},
  {e:'🏆',l:'Achievement milestone',d:'Big milestones trigger aspirational clicks from those who want the same result.'},
  {e:'📖',l:'Story framing',d:'Personal story framing builds authenticity and trust before the video even starts.'},
  {e:'✍️',l:'Bold readable text',d:'Large bold text communicates the key benefit even at thumbnail size.'},
  {e:'💡',l:'Curiosity gap',d:'The thumbnail teases something without giving it away — forcing the viewer to click.'},
];

function pick(i){
  selectedVid=i;
  document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('sel',j===i));
  const v=window._vids[i];
  document.getElementById('genPrompt').value=v.title;
  const whys=[...WHY].sort(()=>Math.random()-.5).slice(0,v.score>=88?4:v.score>=72?3:2);
  document.getElementById('analysisPh').style.display='none';
  const body=document.getElementById('analysisBody');
  body.style.display='block';
  body.innerHTML=`
    ${whys.map(w=>`<div class="wi"><div class="we">${w.e}</div><div><div class="wl">${w.l}</div><div class="wd">${w.d}</div></div></div>`).join('')}
    <div class="sbr">
      <div class="sbl">Thumbnail quality score</div>
      <div class="sbw"><div class="sbf" style="width:${v.score}%"></div></div>
      <div class="sbv">${v.score}/100</div>
    </div>
    <div style="margin-top:10px;padding:8px 10px;background:var(--bg3);border-radius:var(--rs);border:1px solid var(--border)">
      <div style="font-size:11px;color:var(--text3);margin-bottom:3px">Video stats</div>
      <div style="font-size:12px;color:var(--text2)">${fmtViews(v.statistics.viewCount)} · ${v.channel} · ${ago(v.publishedAt)}</div>
    </div>
    <a class="ytl" href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">
      <i class="ti ti-brand-youtube" style="font-size:15px;color:#ff0000"></i>
      Watch on YouTube
      <i class="ti ti-external-link" style="font-size:12px;margin-left:auto"></i>
    </a>`;
}

async function doSearch(q,silent=false){
  const query=q||document.getElementById('navQ').value.trim();
  if(!query)return;
  currentQ=query;
  if(!silent){document.getElementById('navQ').value=query;document.getElementById('secTitle').textContent=`Results for "${query}"`;}
  document.getElementById('secCount').textContent='';
  document.getElementById('analysisPh').style.display='block';
  document.getElementById('analysisBody').style.display='none';
  selectedVid=null;renderSkel();
  try{
    const vids=await fetchVideos(query);
    document.getElementById('secCount').textContent=vids.length+' long-form videos';
    renderVideos(vids);
  }catch(err){
    document.getElementById('grid').innerHTML=`<div class="empty"><i class="ti ti-wifi-off"></i><p>Could not load results.<br><small style="opacity:.6">${err.message}</small></p></div>`;
  }
}

function handleFiles(files){
  [...files].forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{uploadedImgs.push({name:f.name,b64:e.target.result.split(',')[1],mime:f.type,url:e.target.result});renderPrevs();};
    r.readAsDataURL(f);
  });
}
function renderPrevs(){
  document.getElementById('prevs').innerHTML=uploadedImgs.map((img,i)=>`
    <div class="pw"><img class="pi" src="${img.url}" alt="upload"/><button class="pr" onclick="rmImg(${i})">x</button></div>`).join('');
}
function rmImg(i){uploadedImgs.splice(i,1);renderPrevs();}

const uz=document.getElementById('uz');
uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag')});
uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
uz.addEventListener('drop',e=>{e.preventDefault();uz.classList.remove('drag');handleFiles(e.dataTransfer.files)});

function buildPrompt(desc,textOn,style){
  let p=`Create a professional YouTube video thumbnail (16:9 widescreen) for a video about: "${desc}".`;
  if(textOn)p+=` The thumbnail MUST clearly display this bold text: "${textOn}". Make the text large, bold, highly readable.`;
  if(style)p+=` Visual style: ${style}.`;
  p+=` Requirements: eye-catching, high contrast colors, dramatic lighting, professional quality, optimized for maximum click-through rate on YouTube. No watermarks, no borders.`;
  if(uploadedImgs.length)p+=` Use the uploaded photo as the main subject in the thumbnail.`;
  return p;
}

async function generate(){
  const desc=document.getElementById('genPrompt').value.trim();
  const textOn=document.getElementById('genText').value.trim();
  const style=document.getElementById('genStyle').value.trim();
  if(!desc){alert('Please describe your video first!');return;}
  lastPrompt=buildPrompt(desc,textOn,style);
  await runGen(lastPrompt);
}

async function regenerate(){
  if(!lastPrompt)return;
  await runGen(lastPrompt+' Create a completely different composition, color scheme and layout.');
}

async function runGen(prompt){
  const genBtn=document.getElementById('genBtn');
  const regenBtn=document.getElementById('regenBtn');
  const prog=document.getElementById('prog');
  const ra=document.getElementById('ra');
  const ri=document.getElementById('ri');
  const rph=document.getElementById('rph');
  const dl=document.getElementById('dlBtn');

  genBtn.disabled=true;
  genBtn.innerHTML='<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Generating...';
  regenBtn.style.display='none';
  prog.className='prog on';prog.innerHTML='<div class="pf"></div>';
  ra.className='ra';ri.style.display='none';rph.style.display='none';dl.style.display='none';

  try{
    const parts=[{text:prompt}];
    if(uploadedImgs.length)parts.push({inline_data:{mime_type:uploadedImgs[0].mime,data:uploadedImgs[0].b64}});

    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent?key=${GM_KEY}`,
      {method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          contents:[{parts}],
          generationConfig:{responseModalities:['Image','Text']}
        })}
    );
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||'Gemini API error');

    const imgPart=data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData);
    if(imgPart){
      const src=`data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
      ri.src=src;ri.style.display='block';rph.style.display='none';
      dl.href=src;dl.download=`thumbnail-${Date.now()}.png`;dl.style.display='flex';
    }else{
      rph.style.display='flex';
      rph.innerHTML=`<i class="ti ti-info-circle" style="font-size:20px;color:var(--coral)"></i>
        <span>No image was returned by the API.</span>
        <span style="font-size:10px;opacity:.7">Your key may need image generation enabled in Google AI Studio.</span>`;
    }
    ra.className='ra on';regenBtn.style.display='flex';
  }catch(err){
    rph.style.display='flex';
    rph.innerHTML=`<i class="ti ti-alert-triangle" style="font-size:20px;color:var(--coral)"></i>
      <span style="color:var(--coral);font-size:12px">${err.message}</span>`;
    ra.className='ra on';
  }
  genBtn.disabled=false;
  genBtn.innerHTML='<i class="ti ti-sparkles"></i> Generate with Gemini AI';
  prog.className='prog';
}

document.getElementById('navQ').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('secTitle').textContent='Trending now';
  doSearch('most popular YouTube videos',true);
});
</script>
